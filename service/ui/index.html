<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Protocol service</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" id="skip-link">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/documents">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-name">Protocol service</span>
          <span class="brand-sub">demo console</span>
        </span>
      </a>
      <nav class="mainnav" aria-label="Main">
        <a href="#/documents" data-nav="documents">Documents</a>
        <a href="#/tools" data-nav="tools">Tool explorer</a>
        <a href="#/mcp" data-nav="mcp">MCP</a>
        <a href="#/usecases" data-nav="usecases">Use cases</a>
      </nav>
      <div class="topbar-status" id="service-status"></div>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Colour theme: automatic" title="Colour theme: automatic">
        <span class="theme-glyph" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="page-loading" role="status"><span class="spinner" aria-hidden="true"></span> Loading…</div>
  </main>

  <div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <noscript><p class="noscript">This console needs JavaScript (ES modules). The API itself is documented at /docs.</p></noscript>

  <!-- Icons: cloned by modules/dom.js (icon()); 24 x 24 strokes, currentColor. -->
  <template id="icon-set">
    <svg data-icon="upload" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M5 15v3.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg data-icon="refresh" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg data-icon="trash" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 7h15M9.5 7V4.8h5V7m-8 0 .8 12.2A1.5 1.5 0 0 0 8.8 20.6h6.4a1.5 1.5 0 0 0 1.5-1.4L17.5 7M10.2 10.5v6.5m3.6-6.5v6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg data-icon="play" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5.5v13l10.5-6.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <svg data-icon="copy" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 9h10v11H9zM15 9V4H5v11h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <svg data-icon="external" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4h6v6m0-6-9 9M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg data-icon="cloud" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 18.5h10.5a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 7.3 9.2 4.7 4.7 0 0 0 7 18.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <svg data-icon="check" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg data-icon="x" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <svg data-icon="alert" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4 2.8 19.5h18.4zM12 10v4.5m0 2.5v.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg data-icon="doc" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 3.5h7l4 4v13h-11zM13.5 3.5v4h4M9 12h6m-6 3.5h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <svg data-icon="arrow-right" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg data-icon="search" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zm4.8-1.7L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </template>
</body>
</html>
