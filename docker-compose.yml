# Local deployment of the protocol service: REST API, MCP (HTTP at /mcp) and the background worker in one
# container, documents and results in the named volume protocol-data (/data).
#
#   Copy-Item .env.example .env            # once; then set OPENROUTER_API_KEY in .env
#   python scripts/check_build_context.py  # before every build
#   docker compose up -d --build           # build (if needed) and start
#   docker compose ps                      # health: starting -> healthy
#   docker compose logs -f                 # follow the logs
#   docker exec -i protocol-service python -m service.mcp_stdio    # MCP over stdio (no worker in that process)
#   docker compose down                    # stop (the volume and its documents stay)
name: protocol-service

services:
  protocol-service:
    build:
      context: .
      target: production
    image: protocol-service:latest
    container_name: protocol-service  # a fixed name for `docker exec -i protocol-service ...`
    # OPENROUTER_API_KEY and optional settings (.env.example documents every variable). The variables under
    # `environment` override .env: the image's layout and listen address are not settings.
    env_file: .env
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8000"
      HF_HUB_OFFLINE: "1"
    # Loopback only: the API and MCP have no authentication. Never publish this port on another interface
    # (or put it behind a proxy) without adding authentication in front of it.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - protocol-data:/data  # SQLite in WAL mode: a named volume, never a Windows bind mount
    # Measured (2026-10-12, Sanofi 152 pages / 63 tables, fresh conversion, WORKER_CONCURRENCY=1): peak 5.0 GiB
    # resident (the Docling batch subprocess during conversion; ~1.7 GiB in the other stages), 5.6 GiB for the
    # whole container including page cache. 8g leaves ~40 % headroom for larger documents and the API's open
    # documents. Each extra batch process needs about 5 GiB more: WORKER_CONCURRENCY x CONVERT_WORKERS of them run at
    # once (CONVERT_WORKERS=2 under 8g peaked at 7.6 GiB and gave a 152-page protocol no gain; DEPLOY.md, Limits).
    mem_limit: 8g
    healthcheck:  # /health: 200 healthy, 503 not (urlopen raises: exit 1); the image has no curl
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=4)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s  # startup takes about 15-30 s (Docling import for the pipeline fingerprint, recovery)
      start_interval: 5s
    restart: unless-stopped
    # docker stop sends SIGTERM to the server (tini is PID 1, see Dockerfile); the worker then waits up to 30 s
    # for a running job before the job is re-queued for the next start. 45 s leaves room for that.
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  protocol-data:
