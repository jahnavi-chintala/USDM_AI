# Override for one Google Cloud VM (docs/hosting_gcp.md): Caddy in front of the service for HTTPS and an API key,
# the memory limit for CONVERT_WORKERS=2, and the data volume on the VM's data disk. Used together with the base file;
# .env sets COMPOSE_FILE=docker-compose.yml:deploy/gcp/docker-compose.gcp.yml, so plain `docker compose ...` works.
#
# .env must also set PROXY_SITE (the host name, e.g. 34-1-2-3.sslip.io) and PROXY_API_KEY (the key clients send as
# "Authorization: Bearer <key>"); compose refuses to start without them.
services:
  protocol-service:
    # Two conversion batch processes at once (CONVERT_WORKERS=2 in .env) need about 5 GB each, plus 2-3 GB for the
    # rest (DEPLOY.md, Limits).
    mem_limit: 13g

  caddy:
    image: caddy:2.10
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - protocol-service
    ports:
      - "80:80"        # certificate challenges, and a redirect to HTTPS
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      PROXY_SITE: ${PROXY_SITE:?set PROXY_SITE in .env}
      PROXY_API_KEY: ${PROXY_API_KEY:?set PROXY_API_KEY in .env}
    volumes:
      - ./deploy/gcp/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # certificates and the ACME account: keep them, or certificates are requested again
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # The service's data (registry, documents, caches) on the data disk mounted at /srv/protocol-data (owned by uid
  # 10001, the container user): a local ext4 disk, which SQLite in WAL mode needs.
  protocol-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/protocol-data
  caddy-data:
  caddy-config:
